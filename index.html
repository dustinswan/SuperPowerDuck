<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>SuperPowerDuck</title>

    <script src="js/underscore-min.js"></script>
    <script src="js/angular.min.js"></script>
    <script src="js/main.js"></script>

    <link rel="stylesheet" href="css/style.css" type="text/css" media="screen" charset="utf-8">
    <link href="css/font-awesome.css" rel="stylesheet">
</head>
<body ng-app="DuckApp">

<div ng-controller="BoardCtrl">

  <div class='directions-container'>
    <i ng-repeat="d in directions track by $index" class="arrow fa" ng-class="{'fa-arrow-up': d == 0, 'fa-arrow-right': d == 1, 'fa-arrow-down': d == 2, 'fa-arrow-left': d == 3, current: $index+1 == move_count}"></i>
  </div>

  <div class="board-outer-container">
    <div class="board-inner-container">

      <div ng-repeat="row in board" class="row">
        <div ng-repeat="cell in row track by $index" class="tile fa" ng-class="{water: cell == 1, blocked: cell == 0, 'duck fa-rub': cell == 'duck', preboard: cell == 4, 'apple fa-apple': cell == 'apple'}">
        </div>
      </div>
      <div style="clear: both;"></div>
    </div>
  </div>

  <div class="big-notification" ng-show="pre_countdown !== 0">{{ pre_countdown }}</div>

  <div class='dialog' ng-hide="alive">
    <h3>TRY HARDER</h3>
    <p>Your score: {{ duck_position.x }}</p>
    <button ng-click="restart()">Try Again</button>
    <button ng-click="newBoard()">New Level</button>
    <button ng-click="tweetScore()">TWEET SCORE</button>
  </div>

  <div class='controller' ng-show="countdown">
    <div class="countdown">{{ countdown }}</div>
    <div ng-tap="input('up')" class='controller-button up-button'></div>
    <div ng-tap="input('right')" class='controller-button right-button'></div>
    <div ng-tap="input('down')" class='controller-button down-button'></div>
    <div ng-tap="input('left')" class='controller-button left-button'></div>
  </div>

</div>

</body>
</html>
