<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>SuperPowerDuck</title>

    <script src="bower_components/underscore/underscore.js"></script>
    <script src="bower_components/angular/angular.js"></script>
    <script src="bower_components/angular-touch/angular-touch.js"></script>

    <script src="js/main.js"></script>

    <link rel="stylesheet" href="css/style.css" type="text/css" media="screen" charset="utf-8">

    <link href="css/font-awesome.css" rel="stylesheet">
</head>
<body ng-app="DuckApp">

<div id="container" ng-controller="BoardCtrl">

  <div class='score-board'>
    <table style="width: 100%;">
      <thead>
        <tr><th>User</th><th>Score</th></tr>
      </thead>
      <tbody>
        <tr ng-repeat='score in scores'>
          <td> {{ score.user }}</td>
          <td>{{ score.score }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="board-outer-container">

    <div class="board-inner-container">

      <div ng-repeat="row in board" class="row">
        <div ng-repeat="cell in row track by $index" class="tile fa" ng-class="tileClasses(cell)"></div>
      </div>

      <div style="clear: both;"></div>

    </div>

    <div ng-show="countdown" class="overlay big-notification countdown">{{ countdown }}</div>
    <div ng-show="pre_countdown" class="overlay big-notification countdown">{{ { 3: "Ready", 2: "Set", 1: "Go" }[pre_countdown] }}</div>

    <div class='overlay'>
      <i ng-repeat="d in directions track by $index" class="arrow fa" ng-class="{'fa-arrow-up': d == 0, 'fa-arrow-right': d == 1, 'fa-arrow-down': d == 2, 'fa-arrow-left': d == 3, current: $index+1 == move_count}"></i>
    </div>

    <div class='overlay game-over' ng-hide="alive || show_high_scores">
      <div class='final-score'>{{ final_score }}</div>

      <div class='buttons'>
        <div class='try_again' ng-click="newBoard()"></div>
        <div class='tweet_score' ng-click="tweetScore()"></div>
      </div>
    </div>

    <div class='overlay high-scores' ng-show="show_high_scores" ng-click="show_high_scores = false">
      <div ng-repeat="score in high_scores">{{ score.name }} - {{ score.score }}</div>
    </div>

    <!--<canvas ng-show="countdown" ng-click="tap($event)" id="controller_canvas"></canvas>-->
  </div>



</div>

</body>
</html>
