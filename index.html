<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <title>SuperPowerDuck</title>
    <script src="//cdnjs.cloudflare.com/ajax/libs/underscore.js/1.5.2/underscore-min.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/angularjs/1.2.13/angular.min.js"></script>
    <script src="main.js"></script>
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
    <link href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet">
</head>
<body ng-app>

<div ng-controller="BoardCtrl">

  <div class='directions-container'>
    <i ng-repeat="d in directions track by $index" class="arrow fa" ng-class="{'fa-arrow-up': d == 0, 'fa-arrow-right': d == 1, 'fa-arrow-down': d == 2, 'fa-arrow-left': d == 3, current: $index+1 == move_count}"></i>
  </div>

  <div class="board-outer-container">
    <div class="board-inner-container">

      <div ng-repeat="row in board" class="row">
        <div ng-repeat="cell in row track by $index" class="tile fa" ng-class="{water: cell == 1, blocked: cell == 0, 'duck fa-rub': cell == 'duck', preboard: cell == 4, 'apple fa-apple': cell == 'apple'}">
        </div>
      </div>
      <div style="clear: both;"></div>
    </div>
  </div>

  <div ng-show="pre_countdown !== 0">Input directions in {{ pre_countdown }}</div>
  <div ng-show="countdown !== 0">{{ countdown }}</div>

  <div class='dialog' ng-hide="alive">
    <h3>TRY HARDER</h3>
    <p>Your score: {{ duck_position.x }}</p>
    <button ng-click="restart()">Try Again</button>
    <button ng-click="newBoard()">New Level</button>
    <button ng-click="tweetScore()">TWEET SCORE</button>
  </div>

  <div class='controller dialog clear' ng-show="countdown">
    <div ng-click="input('up')" class='up-button'></div>
    <div ng-click="input('right')" class='right-button'></div>
    <div ng-click="input('down')" class='down-button'></div>
    <div ng-click="input('left')" class='left-button'></div>
  </div>

</div>

</body>
</html>
